- id: "1"
  title: "The Wallet tab holds this wallet's settings"
  description: >-
    CAP-1. The sixth in-wallet tab becomes the Wallet tab with the Configure plates in the decided order (Address Book comes in story 2); the Configure screen, its route and the header Configure key are removed, and task screens return to the tab.
  invoke_dev_with: >-
    Read CLAUDE.md, DESIGN.md, docs/agents/INDEX.md and docs/agents/verifying-your-work.md first. Fetch origin/dev before starting. Run the four gates: bun run lint, bun run build, bun run test, bun run check:contrast. Where UI changes, do a browser pass at 320, 390 and desktop widths in both themes and at 200% zoom. Stage by explicit path only. Not started. Today src/pages/Main.tsx PANELS has a Settings tab that mounts AppSettings; ConfigureScreen.tsx is mounted by src/components/AppShell.tsx (lines 73 and 145) on route.screen === 'configure'; AppHeader.tsx has the Configure key (aria-label Configure wallet) and calls resetConfigureFocusReturn; src/lib/configure-launch.ts keeps the focus-return and its Back label says Back to Configure in WalletScreens. Move the plates (NamePlate, ChecksPlate, SeedPlate, ControlPlate, Node, Two-device signing, RemovePlate) into the Wallet tab in the order Name, Checks, Seed, Operating another account, Node, Two-device signing, Remove, with an identity plate on top and the visible heading Settings for <name> plus the Network; retire the configure route and its path with no alias; rename the Back label to Back to Wallet. The in-wallet AppSettings goes away, so until story 2 the Address Book (still global) is reached only from /settings: say so in your hand-back. Update the tests that mount ConfigureScreen or the configure route; a test fails if the Wallet tab shows Remove all wallets or Version and updates. The tab list keeps its fixed order and one h1 per panel.
- id: "2"
  title: "The Address Book belongs to a Wallet"
  description: >-
    CAP-2. The Address Book is stored and read per wallet, the first-time-destination warning tests only the sending wallet's entries, removing a wallet removes its entries, and the book is a plate in the Wallet tab.
  invoke_dev_with: >-
    Read CLAUDE.md, DESIGN.md, docs/agents/INDEX.md and docs/agents/verifying-your-work.md first. Fetch origin/dev before starting. Run the four gates: bun run lint, bun run build, bun run test, bun run check:contrast. Where UI changes, do a browser pass at 320, 390 and desktop widths in both themes and at 200% zoom. Stage by explicit path only. Not started. src/store/app-store.ts holds addressBook: AddressBookEntry[] (persisted, merged by mergePersistedAppState with migrateAddressBook at about line 197, partialized at about line 297); src/pages/tabs/SendTab.tsx reads it at line 69 and decides the warning at lines 177 and 179; AppSettings.tsx renders the entries. Change it to Record<walletId, entries> as AD-50 says: read an old array as {} in the merge (no hydration failure, no migration), keep the counterparty helpers in src/store/address-book.ts unchanged, add the walletId to the write, and delete the wallet's key in removeWalletData (src/lib/teardown.ts, around line 173) without throwing. Add the Address Book plate after Name in the Wallet tab (10 entries then Show all N), remove it from AppSettings, and make the Remove this wallet plate name the wallet and its Address Book. Tests must fail if another wallet's entries are read or silence the warning, and if an old array fails startup.
- id: "3"
  title: "XRPL Bench's settings and the update marker on the Wallets key"
  description: >-
    CAP-3, CAP-4. The chooser's key reads XRPL Bench with its own heading, intro and the All wallets on this device plate; the update marker moves to the wallet header's Wallets key.
  invoke_dev_with: >-
    Read CLAUDE.md, DESIGN.md, docs/agents/INDEX.md and docs/agents/verifying-your-work.md first. Fetch origin/dev before starting. Run the four gates: bun run lint, bun run build, bun run test, bun run check:contrast. Where UI changes, do a browser pass at 320, 390 and desktop widths in both themes and at 200% zoom. Stage by explicit path only. Partly done by stories 1 and 2 (AppSettings is no longer in a wallet and holds no Address Book). Remaining: the chooser's Settings key in src/components/AppShell.tsx (marked from useUpdateMarker at line 42) becomes XRPL Bench; src/pages/SettingsScreen.tsx heading becomes XRPL Bench settings with the intro line; RemoveAllPlate.tsx becomes the plate All wallets on this device, keeping the action Remove all wallets from this device and stating the count of wallets and that the App PIN goes (the count is a device read, no ledger read, AD-36); src/pages/Main.tsx currently marks the Settings tab with showUpdateMarker: move that to the Wallets key in AppHeader.tsx with the accessible name Wallets, update available and the lamp, from the same useUpdateMarker, and carry no marker on the Wallet tab. RemoveAllPlate is also used by src/pages/Onboarding.tsx: check its wording there still reads right. A declined release does not light either marker; applying an update stays in /settings only.
