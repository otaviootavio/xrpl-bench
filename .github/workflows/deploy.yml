name: Deploy

# Only merges reach these branches (direct pushes are rejected by the rulesets),
# so a push here is always a promotion that passed CI.
on:
  push:
    branches: [stage, prod]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  # NEVER cancel a deploy in flight: cancelling mid-upload leaves a half-written
  # deploy directory (docs/decisions.md §8.13).
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      # Rebuilds rather than reusing CI's artifact. Only defensible because the
      # build is byte-reproducible — verified, docs/decisions.md §8.6. Reusing a
      # CI artifact would need workflow_run + `actions: read`, a well-known
      # privilege-escalation shape.
      - name: Build
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: bun run build

      - name: Generate release manifest
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: node scripts/gen-release-manifest.mjs

      # Resolve the target site from the branch. Ref goes through env, never
      # interpolated into the shell.
      - name: Resolve target site
        id: target
        env:
          REF: ${{ github.ref_name }}
        run: |
          case "$REF" in
            prod)  echo "site=xrpl-bench-prod"  >> "$GITHUB_OUTPUT" ;;
            stage) echo "site=xrpl-bench-stage" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::No site mapped for ref '$REF'"; exit 1 ;;
          esac

      # The pinned CLI, not a third-party action. In a threat model where
      # whoever controls the pipeline controls the signing code, an action is an
      # extra vendor executing with BUNNYNET_API_KEY. An exact version, never a
      # dist-tag (§8.13). Note: BUNNYNET_API_KEY, not BUNNY_API_KEY.
      - name: Deploy
        env:
          BUNNYNET_API_KEY: ${{ secrets.BUNNYNET_API_KEY }}
          SITE: ${{ steps.target.outputs.site }}
        run: bunx --bun @bunny.net/cli@0.15.1 sites deploy ./dist --site "$SITE" --force --no-link -o json

      # The gate that stops a stale shell shipping. A freshly created bunny zone
      # defaults to max-age=2592000 on everything, which would pin users to a
      # month-old wallet (§8.7). This turns "verified against live headers" from
      # an intention into an enforced property.
      - name: Verify cache headers
        env:
          REF: ${{ github.ref_name }}
        run: |
          case "$REF" in
            prod)  URL="https://sites-xrpl-bench-prod-pdbywc.b-cdn.net" ;;
            stage) URL="https://sites-xrpl-bench-stage-bpl7ab.b-cdn.net" ;;
          esac
          sleep 10
          node scripts/verify-headers.mjs "$URL"
