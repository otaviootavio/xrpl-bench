name: CI

# Only `dev`, `stage` and `prod` are listed. No branch is directly pushable, so
# `push` fires only on merges — which is what re-gates the merge commit itself
# and makes squash/rebase promotion safe. Feature branches are covered by the
# pull_request event, so nothing runs twice.
on:
  pull_request:
    branches: [dev, stage, prod]
  push:
    branches: [dev, stage, prod]

# Least privilege. No job here needs more; the deploy workflow asks separately.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Never cancel the run that gates a merge into prod.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# ---------------------------------------------------------------------------
# The four job names below (`lint`, `build`, `test`, `contrast`) plus
# `promotion-source` are the repository's required status checks, configured in
# the branch rulesets. THEY ARE A PUBLIC API: renaming one silently breaks
# protection, because the named check never reports and merges block forever.
# Do not rename them, and do not convert them to a matrix (matrix job names
# embed the matrix value).
#
# Every third-party action is pinned to a full commit SHA. A tag is mutable, and
# a compromised action would run with this repository's permissions.
# See docs/decisions.md §8.12 and docs/agents/shipping-and-ci.md.
# ---------------------------------------------------------------------------

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      # --deny-warnings lives in the package script, so this is byte-identical
      # to what a maintainer runs locally (docs/decisions.md §8.5).
      - run: bun run lint

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      # `build` is `tsc -b && vite build`, so typecheck is covered here.
      - run: bun run build
      # Deliberately uploads no artifact. The deploy workflow rebuilds, which is
      # only defensible because the build is reproducible — verified, see
      # docs/decisions.md §8.6. Reusing this artifact would need a workflow_run
      # trigger plus `actions: read`, a well-known privilege-escalation shape.

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run test

  contrast:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      # NO INSTALL STEP, DELIBERATELY. scripts/check-contrast.mjs imports only
      # node:fs / node:url / node:path and reads src/index.css, so the runner's
      # preinstalled node is enough. If you ever add a dependency to that
      # script, YOU HAVE BROKEN THIS JOB — add setup-bun and an install here.
      - run: node scripts/check-contrast.mjs

  # Enforces `prod` may only be merged from `stage`, and `stage` only from
  # `dev`. This cannot be a ruleset: GitHub rulesets have no source-branch
  # rule (docs/decisions.md §8.4). The job always runs so it always reports a
  # conclusion — a skipped required check is not the same thing as a passing
  # one.
  #
  # Checks TREE EQUALITY against the required source branch's current tip,
  # not the PR's branch name (docs/decisions.md §11). The real invariant a
  # promotion must satisfy is "carries exactly what was already reviewed on
  # the source branch — not more, not less"; a literal name match was only
  # ever a proxy for that, and a weaker one: it happens to block a
  # legitimately-rebased promotion (dev and stage are promoted via
  # independent squash merges, so their tips can diverge in commit hash while
  # staying tree-identical — recovering from that requires a branch rebased
  # onto the target's own tip, which is never literally named "dev") while
  # NOT actually stopping a branch that merely starts from dev's tip and adds
  # unreviewed commits on top, since a name check never inspects content.
  # Tree equality catches both cases correctly.
  promotion-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      # Refs go through `env`, never interpolated into the shell. A branch name
      # is attacker-controlled on a fork PR; inline interpolation is script
      # injection (docs/agents/shipping-and-ci.md). HEAD_SHA is a commit hash
      # in a fixed format for the same reason, not a free-form string.
      - name: Check promotion source
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "Not a pull request; nothing to check."
            exit 0
          fi
          echo "PR into: $BASE"

          require_tree_matches() {
            local source_branch="$1"
            # Explicit destination ref: a bare `git fetch origin <branch>`
            # only populates FETCH_HEAD, not `origin/<branch>` — actions/checkout
            # does not configure the full default refspec.
            git fetch origin "$source_branch:refs/remotes/origin/$source_branch"
            if ! git diff --quiet "origin/$source_branch" "$HEAD_SHA"; then
              echo "::error::this PR's resulting tree does not exactly match '$source_branch''s current tip."
              echo "A promotion must carry exactly what was already reviewed and merged into '$source_branch' — not more, not less."
              return 1
            fi
          }

          if [ "$BASE" = "prod" ]; then
            require_tree_matches stage || { echo "Promote dev -> stage first, then stage -> prod."; exit 1; }
          fi
          if [ "$BASE" = "stage" ]; then
            require_tree_matches dev || exit 1
          fi
          echo "Promotion source is valid."
